<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <title>플래너 비밀번호 설정</title>
  <link rel="stylesheet" href="../main_style.css">
  <link rel="stylesheet" href="planner.css">
  <script src="setup-password.js" defer></script>
</head>
<body>
  <main class="login-view">
    <section class="login-card" style="width:min(100%,640px)" aria-labelledby="setup-title">
      <h1 id="setup-title">비밀번호 설정</h1>
      <p class="help-text">입력한 비밀번호로 로그인에 필요한 설정값을 만듭니다. 비밀번호는 외부로 전송되지 않습니다.
        생성된 값도 비밀번호처럼 보관해 주세요.</p>
      <form id="setup-form">
        <label>새 비밀번호<input id="new-password" type="password" minlength="6" maxlength="256" required autocomplete="new-password" placeholder="6자 이상 입력"></label>
        <label>비밀번호 확인<input id="confirm-password" type="password" minlength="6" maxlength="256" required autocomplete="new-password"></label>
        <button id="generate" class="button primary wide" type="submit">설정값 만들기</button>
      </form>
      <p id="setup-message" class="login-message" role="status"></p>
      <section id="result" hidden>
        <p class="help-text">Apps Script → 프로젝트 설정 → 스크립트 속성에 이름은 <strong>PLANNER_AUTH</strong>, 값은 아래 내용으로 추가하세요.</p>
        <label for="auth-config">PLANNER_AUTH 값</label>
        <textarea id="auth-config" readonly rows="7" spellcheck="false" style="font-family:Consolas,monospace;font-size:.75rem"></textarea>
        <button id="copy" class="button" type="button">설정값 복사</button>
        <button id="clear" class="text-button" type="button">화면에서 지우기</button>
        <p class="help-text">비밀번호를 변경하려면 새 설정값을 만들어 PLANNER_AUTH를 교체하세요. 저장된 기록은 유지되며, 모든 기기에서 다시 로그인해야 합니다.</p>
      </section>
    </section>
  </main>
</body>
</html>
